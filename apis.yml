aid: unicamp
name: University of Campinas
x-type: university
x-category: Public Research University
description: >-
  The University of Campinas (Universidade Estadual de Campinas, Unicamp) is a public research
  university in Campinas, Sao Paulo, Brazil, and one of Latin America's largest producers of
  research output. It publishes no central developer portal and no public API documentation, but
  it does operate more machine-readable surface than that absence suggests, and all of it sits on
  its own registrable domain: REDU, a self-hosted Dataverse 6.2 research data repository with a
  live Native/Search API and an OAI-PMH endpoint over 2,149 datasets; the EDAT data platform,
  whose Kong gateway at api.dados.unicamp.br serves at least one publicly callable JSON endpoint
  and gates the rest behind Unicamp's own Keycloak realm with full OIDC discovery; per-journal
  OAI-PMH across the SBU journal portal; and a Shibboleth identity provider registered in CAFe,
  Brazil's academic identity federation. Two further gateways are live but closed - the registrar
  API at api.dac.unicamp.br (403 on every path) and an institutional Sensedia gateway at
  api.unicamp.br (routing but no public route). Unicamp is also a DataCite provider in its own
  right and a Crossref member. Nothing here is documented for third-party developers; the
  contracts in this repo were reconstructed by probe, not published by the university.
