x-coverage:
  state: covered
  reason: covered
  detail: >-
    Unicamp operates no public developer portal and publishes no API documentation or OpenAPI, but
    it is not empty: four institution-operated machine-readable surfaces were probed live on
    2026-09-01 - the REDU Dataverse API and its OAI-PMH endpoint, the EDAT Kong gateway with one
    publicly callable JSON route, the EDAT Keycloak OIDC discovery document, and per-journal
    OAI-PMH on the SBU journal portal - plus a Shibboleth IdP registered in the CAFe federation
    and DataCite / Crossref / ROR registry memberships. Two further institution-operated gateways
    are live but closed to the public (api.dac.unicamp.br returns 403 everywhere,
    api.unicamp.br routes nothing publicly). No vendor contract is attributed to Unicamp: the
    Dataverse and OJS interface designs belong to their projects and are deliberately not saved
    here, and the only OpenAPI in the repo is one API Evangelist reconstructed by probe and marked
    as such. Portuguese-language surfaces were searched directly.
