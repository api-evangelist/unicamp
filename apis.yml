      - type: Scopes
        url: scopes/unicamp-edat-oidc-scopes.yml
      - type: Discovery
        url: https://seguranca.dados.unicamp.br/realms/edat/.well-known/openid-configuration
  - aid: unicamp:cafe-shibboleth-idp
    name: Unicamp Shibboleth Identity Provider (CAFe)
    x-operator: federation
    description: >-
      Unicamp's own SAML 2.0 / Shibboleth identity provider, entityID
      https://cafe.unicamp.br/idp/shibboleth, registered in CAFe - RNP's Brazilian academic
