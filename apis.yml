  - aid: unicamp:edat-data-api
    name: EDAT Data Platform API
    x-operator: institution
    description: >-
      API gateway (Kong) for Unicamp's Escritorio de Dados e Apoio a Tomada de Decisao (EDAT),
      the university's data office. It backs catalogo.dados.unicamp.br and
      apoio.dados.unicamp.br. Verified live 2026-09-01: GET /superset/public/papeis returns 200
