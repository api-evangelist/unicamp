      definition; the IdP behind this entry is Unicamp's. Verified live 2026-09-01: the entity is
      present in https://ds.cafe.rnp.br/metadata/cafe-metadata.xml (200, 3.3MB) with
      OrganizationDisplayName "UNICAMP - Universidade Estadual de Campinas", shibmd:Scope
      unicamp.br and contact suporte-infra@detic.unicamp.br, and the IdP self-serves its metadata
      at https://cafe.unicamp.br/idp/shibboleth (200, SAML EntityDescriptor). Two Unicamp service
      providers are registered in the same federation.
    humanURL: https://www.rnp.br/servicos/servicos-por-categoria/gestao-de-identidade/cafe
    baseURL: https://cafe.unicamp.br/idp
    tags: [ Identity Federation, Shibboleth, SAML, eduGAIN, CAFe ]
    properties:
      - type: Metadata
