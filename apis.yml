      2026-09-01: verb=Identify returns 200 for repository "Repositorio de Dados de Pesquisa da
      Unicamp Dataverse OAI Archive" with baseURL https://redu.unicamp.br/oai. OAI-PMH is a named
      standard in the Kin Score education regime and this is one of two independent Unicamp
      endpoints serving it.
    humanURL: https://redu.unicamp.br/
    baseURL: https://redu.unicamp.br/oai
    tags: [ OAI-PMH, Metadata Harvesting, Research Data, Repository ]
    properties:
