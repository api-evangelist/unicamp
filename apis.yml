  - aid: unicamp:institutional-api-gateway
    name: Institutional API Gateway (api.unicamp.br)
    x-operator: institution
    description: >-
      Unicamp's central API gateway. The hostname is Unicamp's; the gateway platform is Sensedia
      (api.unicamp.br CNAMEs to alias.b3r06ix53m-gateway-default.sensedia.net behind an AWS
      sa-east-1 load balancer), so the vendor tenancy is on the DELIVERY layer while the APIs
      routed through it are the university's own. Verified live 2026-09-01: every path probed
      returns the Sensedia routing error "Could not route request", which proves the gateway is
      serving and that no route is exposed to unauthenticated callers. No developer portal, no
      catalog and no documentation were found for it.
    humanURL: https://www.unicamp.br/
    baseURL: https://api.unicamp.br
    tags: [ Gateway, API Management, Sensedia, Closed ]
