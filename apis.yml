apis:
  - aid: unicamp:redu-dataverse-api
    name: REDU Dataverse Native & Search API
    x-operator: institution
    description: >-
      REDU (Repositorio de Dados de Pesquisa da Unicamp) is Unicamp's institutional research data
      repository, self-hosted on the open-source Dataverse platform at redu.unicamp.br - a
      Unicamp-owned host, not a vendor tenancy (redu.unicamp.br CNAMEs to
      redu-app.sbu.unicamp.br, the university library system). It exposes the standard Dataverse
      REST API. Verified live 2026-09-01: /api/info/version returns 6.2 (build 1603-a218417),
      /api/search returns total_count 2,149 datasets, /api/info/metrics/datasets returns 2,149.
      Datasets are minted with DataCite DOIs under doi:10.25824/redu/. The API CONTRACT is
      Dataverse's, shared by every Dataverse deployment worldwide, so no OpenAPI is saved under
      Unicamp - the deployment is theirs, the interface design is not.
    humanURL: https://redu.unicamp.br/
    baseURL: https://redu.unicamp.br/api
    tags: [ Research Data, Dataverse, Open Data, Datasets, Repository ]
    properties:
      - type: Documentation
        url: https://guides.dataverse.org/en/6.2/api/native-api.html
      - type: Documentation
        url: https://guides.dataverse.org/en/6.2/api/search.html
      - type: Website
        url: https://redu.unicamp.br/
  - aid: unicamp:redu-oai-pmh
    name: REDU OAI-PMH Metadata Endpoint
    x-operator: institution
    description: >-
