      /suporte/public/sistemas returns 401 {"message":"Unauthorized"}; unrouted paths return the
      Kong "no Route matched with those values" envelope. Unicamp publishes no OpenAPI for it -
      the definition in this repo was reconstructed from those probes and from the route names in
      the catalog front-end bundle, and is marked as ours.
    humanURL: https://catalogo.dados.unicamp.br/
    baseURL: https://api.dados.unicamp.br
    tags: [ Open Data, Institutional Data, Gateway, Analytics ]
    properties:
