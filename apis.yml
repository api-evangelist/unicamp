  - aid: unicamp:sbu-periodicos-oai
    name: SBU Journal Portal OAI-PMH Endpoints
    x-operator: institution
    description: >-
      Unicamp's library system (SBU) self-hosts the Portal de Periodicos Eletronicos Cientificos
      on Open Journal Systems 3.4.0.9 at periodicos.sbu.unicamp.br, with a per-journal OAI-PMH
